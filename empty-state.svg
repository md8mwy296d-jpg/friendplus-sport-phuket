<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <!-- Spot illustration: football & padel racket under a stylized palm, a seated character waiting with a phone. Flat geometric, tropical palette. -->
  <!-- backdrop sun circle -->
  <circle cx="300" cy="210" r="150" fill="#FFE8C9"/>
  <circle cx="300" cy="210" r="150" fill="none" stroke="#FFB547" stroke-width="3" stroke-dasharray="4 10" opacity="0.7"/>
  <!-- ground -->
  <ellipse cx="300" cy="392" rx="240" ry="26" fill="#EADFC8"/>
  <!-- palm tree -->
  <path d="M140 390 C 132 320 138 250 158 190" fill="none" stroke="#1E5945" stroke-width="16" stroke-linecap="round"/>
  <g stroke="#0E8C7F" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M158 190 C 120 160 80 158 52 176"/>
    <path d="M158 190 C 130 146 96 132 62 138"/>
    <path d="M158 190 C 156 148 172 116 204 100"/>
    <path d="M158 190 C 188 158 224 150 258 162"/>
    <path d="M158 190 C 196 178 232 186 254 210"/>
  </g>
  <circle cx="166" cy="196" r="10" fill="#FFB547"/>
  <circle cx="148" cy="202" r="10" fill="#FF6B4A"/>
  <!-- football -->
  <g transform="translate(400 358)">
    <circle r="34" fill="#FFFFFF" stroke="#0B2E2B" stroke-width="4"/>
    <polygon points="0,-14 13,-5 8,12 -8,12 -13,-5" fill="#0B2E2B"/>
    <g stroke="#0B2E2B" stroke-width="3" fill="none">
      <path d="M0 -14 L0 -30"/><path d="M13 -5 L30 -9"/><path d="M8 12 L18 27"/>
      <path d="M-8 12 L-18 27"/><path d="M-13 -5 L-30 -9"/>
    </g>
  </g>
  <!-- padel racket leaning -->
  <g transform="translate(482 330) rotate(24)">
    <rect x="-5" y="34" width="10" height="42" rx="5" fill="#1E5945"/>
    <ellipse cx="0" cy="0" rx="30" ry="38" fill="#FF6B4A"/>
    <ellipse cx="0" cy="0" rx="22" ry="30" fill="#FBF6EC"/>
    <g fill="#FF6B4A">
      <circle cx="-10" cy="-14" r="3"/><circle cx="0" cy="-14" r="3"/><circle cx="10" cy="-14" r="3"/>
      <circle cx="-10" cy="-2" r="3"/><circle cx="0" cy="-2" r="3"/><circle cx="10" cy="-2" r="3"/>
      <circle cx="-10" cy="10" r="3"/><circle cx="0" cy="10" r="3"/><circle cx="10" cy="10" r="3"/>
    </g>
  </g>
  <!-- seated character looking at phone -->
  <g transform="translate(258 288)">
    <!-- legs -->
    <path d="M0 60 L 34 96 L 78 96" fill="none" stroke="#0B2E2B" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- torso -->
    <path d="M0 62 C -6 34 -2 14 8 0" fill="none" stroke="#0E8C7F" stroke-width="24" stroke-linecap="round"/>
    <!-- arm + phone -->
    <path d="M4 14 L 30 30" fill="none" stroke="#C77B54" stroke-width="12" stroke-linecap="round"/>
    <rect x="24" y="8" width="16" height="26" rx="4" fill="#0B2E2B" transform="rotate(-18 32 21)"/>
    <!-- head -->
    <circle cx="14" cy="-22" r="17" fill="#C77B54"/>
    <path d="M-2 -30 C 0 -44 28 -44 30 -26 C 22 -34 6 -34 -2 -30 Z" fill="#0B2E2B"/>
  </g>
  <!-- floating leaves -->
  <g fill="#2FBFA5">
    <ellipse cx="88" cy="110" rx="12" ry="6" transform="rotate(-30 88 110)"/>
    <ellipse cx="512" cy="120" rx="12" ry="6" transform="rotate(20 512 120)"/>
    <ellipse cx="470" cy="70" rx="9" ry="5" transform="rotate(-15 470 70)"/>
  </g>
  <ellipse cx="540" cy="180" rx="10" ry="5" fill="#FFB547" transform="rotate(35 540 180)"/>
</svg>
